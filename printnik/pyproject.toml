[project]
name = "printnik"
version = "0.3.0"
description = "Local sticker production pipeline"
requires-python = ">=3.11"
dependencies = ["Pillow>=12,<13", "numpy>=2,<3"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
printnik = "printnik.prototype:main"

[tool.setuptools]
packages = ["printnik"]

[tool.pytest.ini_options]
testpaths = ["tests"]

